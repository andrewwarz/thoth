[package]
name = "thoth"
version = "0.1.0"
edition = "2021"
description = "Natural language to shell commands using local LLMs"
license = "MIT"
repository = "https://github.com/andrewwarz/thoth"
keywords = ["cli", "ai", "ollama", "shell", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "thoth"
path = "src/main.rs"

[lib]
name = "thoth"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
